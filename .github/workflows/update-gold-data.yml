name: 匯入黃金 CSV（403 備援）
on:
  workflow_dispatch:
    inputs:
      month:
        description: '要匯入的月份（例如 2025-01）'
        required: true
        default: '2025-01'
permissions:
  contents: write
concurrency:
  group: gold-historical-data
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert official CSV to monthly JSON
        env:
          MONTH: ${{ inputs.month }}
        shell: bash
        run: |
          python import_gold_csv.py "imports/xauusd/${MONTH}.csv" --month "$MONTH"
      - name: Commit monthly historical candles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/xauusd
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Import XAUUSD history from official CSV'
            git push
          fi
